<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#1e1b4b" />
      <stop offset="100%" stop-color="#090d16" />
    </linearGradient>
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ef4444" />
      <stop offset="50%" stop-color="#f97316" />
      <stop offset="100%" stop-color="#38bdf8" />
    </linearGradient>
    <linearGradient id="roadGrad" x1="50%" y1="100%" x2="50%" y2="40%">
      <stop offset="0%" stop-color="#334155" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    <radialGradient id="hotspotGlow" cx="50%" cy="42%" r="50%">
      <stop offset="0%" stop-color="#ef4444" stop-opacity="1" />
      <stop offset="40%" stop-color="#f97316" stop-opacity="0.8" />
      <stop offset="70%" stop-color="#eab308" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#ef4444" stop-opacity="0" />
    </radialGradient>
    <filter id="glowFilter" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="2.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Squircle Base -->
  <rect x="4" y="4" width="92" height="92" rx="24" fill="url(#bgGrad)" stroke="url(#borderGrad)" stroke-width="3" />

  <!-- Radar Pulse Rings -->
  <circle cx="50" cy="40" r="26" stroke="#ef4444" stroke-width="1.5" stroke-opacity="0.3" stroke-dasharray="3 3" />
  <circle cx="50" cy="40" r="18" stroke="#f97316" stroke-width="1.5" stroke-opacity="0.5" />
  <circle cx="50" cy="40" r="11" stroke="#fbbf24" stroke-width="2" stroke-opacity="0.75" />

  <!-- Road Perspective Trapeze -->
  <path d="M22 88 L44 54 L56 54 L78 88 Z" fill="url(#roadGrad)" />
  <path d="M22 88 L44 54" stroke="#475569" stroke-width="2" />
  <path d="M78 88 L56 54" stroke="#475569" stroke-width="2" />

  <!-- Road Dashed Centerline -->
  <line x1="50" y1="86" x2="50" y2="76" stroke="#38bdf8" stroke-width="3" stroke-linecap="round" />
  <line x1="50" y1="70" x2="50" y2="62" stroke="#38bdf8" stroke-width="2.5" stroke-linecap="round" />
  <line x1="50" y1="58" x2="50" y2="54" stroke="#38bdf8" stroke-width="2" stroke-linecap="round" />

  <!-- Hotspot Target Beacon & Pin -->
  <circle cx="50" cy="40" r="15" fill="url(#hotspotGlow)" />
  <!-- Map Pin Shield -->
  <path d="M50 24 C43 24 38 29 38 36 C38 45 50 55 50 55 C50 55 62 45 62 36 C62 29 57 24 50 24 Z" fill="#ef4444" filter="url(#glowFilter)" />
  <circle cx="50" cy="35" r="4.5" fill="#ffffff" />
</svg>
